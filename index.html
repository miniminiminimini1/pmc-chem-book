<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d9488">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Principles of Modern Chemistry · 目录浏览与智能检索</title>
<style>
:root{
  --bg:#eef2f7; --panel:#fff; --ink:#1e293b; --ink-2:#475569; --ink-3:#94a3b8;
  --line:#e6ebf1; --accent:#0d9488; --accent-2:#0f766e; --accent-soft:#ccfbf1;
  --indigo:#4f46e5; --shadow:0 1px 2px rgba(15,23,42,.06),0 10px 28px -14px rgba(15,23,42,.22);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{
  margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden;
}
.app{height:100vh;height:100dvh;display:flex;flex-direction:column}
button{font-family:inherit}

header.top{
  flex:none;display:flex;align-items:center;gap:14px;padding:10px 16px;
  background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);z-index:30;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{
  width:38px;height:38px;border-radius:11px;flex:none;color:#fff;font-weight:800;font-size:12.5px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(140deg,var(--accent),var(--indigo));box-shadow:0 6px 16px -6px rgba(13,148,136,.7);
}
.brand h1{margin:0;font-size:14.5px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .sub{margin:1px 0 0;font-size:11px;color:var(--ink-3)}
.search{
  flex:1 1 240px;display:flex;align-items:center;gap:9px;background:#f1f5f9;border:1px solid var(--line);
  border-radius:11px;padding:0 12px;height:42px;transition:.18s;max-width:560px;
}
.search:focus-within{background:#fff;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.search svg{width:17px;height:17px;color:var(--ink-3);flex:none}
.search input{flex:1;border:0;outline:0;background:transparent;font-size:15px;color:var(--ink);min-width:0}
.search input::placeholder{color:#9aa7b8}
.search kbd{font-family:inherit;font-size:11px;color:var(--ink-3);background:#fff;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:2px 6px}
.btn{
  border:1px solid var(--line);background:#fff;color:var(--ink-2);height:42px;padding:0 13px;border-radius:11px;
  font-size:12.5px;font-weight:650;cursor:pointer;transition:.16s;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:7px;
}
.btn:hover{border-color:var(--accent);color:var(--accent-2);background:#f0fdfa}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:default}
.btn.primary{background:linear-gradient(140deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff;box-shadow:0 6px 16px -8px rgba(13,148,136,.8)}
.btn.primary:hover{color:#fff;background:linear-gradient(140deg,var(--accent-2),var(--accent-2))}
.app.reading #searchWrap,.app.reading #expandAll,.app.reading #collapseAll{display:none}

.stage{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.view[hidden]{display:none}

/* ---------- toc ---------- */
.toc-head{
  flex:none;display:flex;align-items:center;gap:9px;padding:10px 18px;border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.7);font-size:12.5px;color:var(--ink-3);flex-wrap:wrap;
}
.toc-head .grow{flex:1}
.chip{
  border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;font-size:12.5px;font-weight:650;
  color:var(--ink-2);cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px;max-width:76%;
}
.chip:hover{border-color:var(--accent);color:var(--accent-2);background:#f0fdfa}
.chip.accent{background:var(--accent-soft);border-color:#99f6e4;color:var(--accent-2)}
.chip b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:750}
.toc{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 70px;max-width:1000px;width:100%;margin:0 auto;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.toc::-webkit-scrollbar{width:10px}
.toc::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:10px;border:3px solid var(--bg)}

.block{margin-bottom:11px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;box-shadow:var(--shadow)}
.block-head{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer;user-select:none;transition:background .15s}
.block-head:active{background:#f1f5f9}
.unit-badge{
  flex:none;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:14px;color:#fff;background:linear-gradient(140deg,var(--accent),var(--accent-2));
}
.unit-badge.alt{background:linear-gradient(140deg,#6366f1,#4338ca)}
.unit-badge.warm{background:linear-gradient(140deg,#f59e0b,#d97706)}
.block-head .t{min-width:0;flex:1}
.block-head .t h2{margin:0;font-size:14.5px;font-weight:750;line-height:1.3}
.block-head .t p{margin:3px 0 0;font-size:11.5px;color:var(--ink-3)}
.chev{flex:none;width:19px;height:19px;color:var(--ink-3);transition:transform .22s}
.block.collapsed .chev{transform:rotate(-90deg)}
.block-body{padding:0 12px 8px}
.block.collapsed .block-body{display:none}

.chapter{border-top:1px solid var(--line)}
.chapter:first-child{border-top:0}
.ch-head{display:flex;align-items:center;gap:11px;padding:12px 10px;border-radius:10px;cursor:pointer;min-height:48px}
.ch-head:active{background:#f1f5f9}
.ch-num{
  flex:none;min-width:34px;height:32px;padding:0 9px;border-radius:9px;background:var(--accent-soft);color:var(--accent-2);
  font-weight:800;font-size:12.5px;display:flex;align-items:center;justify-content:center;
}
.ch-head .ct{flex:1;min-width:0;font-size:13.8px;font-weight:650;line-height:1.35}
.ch-head .pg{font-size:11.5px;color:var(--ink-3);font-weight:600;flex:none}
.chapter.collapsed .ch-body{display:none}
.chapter.collapsed .ch-head .chev{transform:rotate(-90deg)}
.ch-body{padding:0 2px 8px 14px}

.leaf{
  display:flex;align-items:baseline;gap:9px;padding:12px 12px 12px 14px;border-radius:10px;cursor:pointer;
  border-left:3px solid transparent;transition:.14s;min-height:46px;
}
.leaf:hover{background:#f0fdfa;border-left-color:var(--accent)}
.leaf:active{background:var(--accent-soft)}
.leaf.active{background:var(--accent-soft);border-left-color:var(--accent-2)}
.leaf.active .stitle{color:var(--accent-2);font-weight:700}
.leaf .snum{flex:none;font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:750;color:var(--accent-2);min-width:38px}
.leaf .stitle{font-size:13.6px;color:var(--ink-2);line-height:1.45}
.leaf .leader{flex:1;border-bottom:1px dotted #d3dce6;margin:0 5px;transform:translateY(-3px);min-width:12px}
.leaf .pg{flex:none;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;font-weight:600}
/* 本节作业：与正文小节分开的子条目 */
.hwrow{
  display:flex;align-items:baseline;gap:8px;padding:8px 12px 8px 34px;border-radius:10px;cursor:pointer;
  transition:.14s;min-height:40px;margin:-2px 0 4px;
}
.hwrow:hover{background:#fffbeb}
.hwrow:active{background:#fef3c7}
.hwrow .hwt{
  flex:none;font-size:11px;font-weight:800;color:#b45309;background:#fef3c7;border:1px solid #fde68a;
  border-radius:6px;padding:2px 7px;letter-spacing:.5px;
}
.hwrow .hwn{font-size:12.6px;color:#92400e;font-weight:600}
.hwrow .leader{flex:1;border-bottom:1px dotted #ecdcb8;margin:0 5px;transform:translateY(-3px);min-width:12px}
.hwrow .pg{flex:none;font-size:11.5px;color:#a16207;font-weight:650;font-variant-numeric:tabular-nums}
mark{background:#fde68a;color:#7c2d12;border-radius:3px;padding:0 2px}
.muted{padding:8px 14px 12px;color:var(--ink-3);font-size:12.5px}
.hidden{display:none !important}

/* ---------- reader ---------- */
.rbar{
  flex:none;display:flex;align-items:center;gap:8px;padding:9px 12px;background:#fff;border-bottom:1px solid var(--line);
  padding-top:calc(9px + env(safe-area-inset-top));
}
.rbar .rt{min-width:0;flex:1}
.rbar .rt .vt{font-size:13.5px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbar .rt .vs{font-size:11px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{
  width:42px;height:42px;flex:none;border-radius:11px;border:1px solid var(--line);background:#fff;color:var(--ink-2);
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;
}
.ibtn:hover:not(:disabled){border-color:var(--accent);color:var(--accent-2);background:#f0fdfa}
.ibtn:active:not(:disabled){background:var(--accent-soft)}
.ibtn:disabled{opacity:.35;cursor:not-allowed}
.ibtn svg{width:19px;height:19px}
.ibtn.txt{width:auto;padding:0 12px;font-size:12.5px;font-weight:650;gap:6px}
.ibtn.ai{color:var(--accent-2);border-color:#99f6e4;background:#f0fdfa}
.ibtn.ai:hover:not(:disabled){color:#fff;background:linear-gradient(140deg,var(--accent),var(--accent-2));border-color:transparent}

.rstage{
  flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;background:#dde4ec;
  padding:10px 0 14px;position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
.pagewrap{width:100%;max-width:880px;margin:0 auto;position:relative;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 6px 24px -12px rgba(15,23,42,.4)}
#pageImg{width:100%;display:block;background:#fff}
#pageImg.anim{animation:pageIn .2s ease}
@keyframes pageIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.pload{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#fff;z-index:2}
.pload.show{display:flex}
.spinner{width:26px;height:26px;border:3px solid #cbd5e1;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pgmiss{display:none;padding:60px 20px;text-align:center;color:var(--ink-3);font-size:13px}
.pgmiss.show{display:block}

.rfoot{
  flex:none;display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 12px;
  background:#fff;border-top:1px solid var(--line);padding-bottom:calc(9px + env(safe-area-inset-bottom));
}
.rfoot .nav{display:flex;align-items:center;justify-content:center;gap:8px;flex:1;max-width:620px}
.pgpill{
  font-size:13px;font-weight:750;color:var(--ink-2);background:#f1f5f9;border:1px solid var(--line);
  border-radius:11px;padding:11px 14px;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:96px;text-align:center;
}
.lb{display:none}

/* ---------- locate list ---------- */
.loc-wrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 70px;max-width:900px;width:100%;margin:0 auto}
.loc-note{
  background:#eef2ff;border:1px solid #c7d2fe;color:#3730a3;border-radius:12px;padding:11px 13px;
  font-size:12.5px;line-height:1.6;margin-bottom:12px;
}
.loc-item{
  display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border:1px solid var(--line);border-radius:14px;
  background:#fff;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow);transition:.15s;
}
.loc-item:hover{border-color:var(--accent);background:#f0fdfa}
.loc-item:active{background:var(--accent-soft)}
.loc-rank{
  flex:none;width:28px;height:28px;border-radius:9px;color:#fff;font-weight:800;font-size:12.5px;
  display:flex;align-items:center;justify-content:center;background:linear-gradient(140deg,var(--accent),var(--accent-2));
}
.loc-main{flex:1;min-width:0}
.loc-title{font-size:14px;font-weight:700;line-height:1.4}
.loc-title .snum{color:var(--accent-2);margin-right:6px;font-variant-numeric:tabular-nums}
.loc-ctx{font-size:11.5px;color:var(--ink-3);margin-top:4px}
.loc-reason{
  font-size:12.5px;color:var(--ink-2);margin-top:7px;background:#f8fafc;border-left:3px solid var(--accent);
  padding:7px 10px;border-radius:0 7px 7px 0;line-height:1.55;
}
.loc-empty{text-align:center;color:var(--ink-3);font-size:13px;padding:50px 20px;line-height:1.8}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;background:rgba(15,23,42,.45)}
.modal[hidden]{display:none}
.modal-card{
  background:#fff;width:100%;max-width:580px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));
  box-shadow:0 -10px 40px rgba(15,23,42,.3);animation:sheetIn .22s ease;
}
@keyframes sheetIn{from{transform:translateY(26px);opacity:.6}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.modal-head .mt{flex:1;font-size:15px;font-weight:750;display:flex;align-items:center;gap:7px}
.modal-head .mt .spark{color:var(--accent)}
.modal-desc{margin:0 0 11px;font-size:12.5px;color:var(--ink-3);line-height:1.6}
#askInput{
  width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:15px;font-family:inherit;
  color:var(--ink);resize:vertical;min-height:84px;outline:none;background:#f8fafc;
}
#askInput:focus{background:#fff;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.ask-hints{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.hint-chip{
  font-size:12px;color:var(--ink-2);background:#f1f5f9;border:1px solid var(--line);border-radius:999px;
  padding:6px 11px;cursor:pointer;transition:.15s;
}
.hint-chip:hover{border-color:var(--accent);color:var(--accent-2);background:#f0fdfa}
.modal-foot{display:flex;gap:9px;justify-content:flex-end;margin-top:14px}
.ask-status{font-size:12.5px;margin-top:10px;min-height:18px;color:var(--ink-3);line-height:1.5}
.ask-status.loading{color:var(--accent-2)}
.ask-status.error{color:#dc2626}

.toast{
  position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);
  opacity:0;pointer-events:none;background:#0f172a;color:#fff;font-size:12.5px;padding:10px 16px;border-radius:10px;
  transition:.25s;z-index:90;max-width:86vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:640px){
  header.top{flex-wrap:wrap;gap:10px;padding:9px 12px}
  .brand{flex:1 1 100%}
  .search{flex:1 1 100%;max-width:none;order:3}
  #expandAll,#collapseAll{flex:1 1 auto}
  .brand h1{font-size:13.5px}
  .toc{padding:10px 10px 70px}
  .toc-head{padding:8px 12px}
  .block{border-radius:12px}
  .block-head{padding:11px 12px}
  .block-head .t h2{font-size:13.5px}
  .unit-badge{width:40px;height:40px;font-size:13px;border-radius:11px}
  .ch-body{padding-left:8px}
  .leaf .stitle{font-size:13.2px}
  .hwrow{padding-left:22px}
  .rbar{padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top))}
  .rbar .rt .vt{font-size:13px}
  .rbar .rt .vs{display:none}
  .rfoot{padding:8px 8px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
  .pgpill{min-width:84px;padding:10px 10px;font-size:12.5px}
  .ibtn{width:44px;height:44px}
  .ibtn.txt{padding:0 10px}
  .pagewrap{border-radius:0;max-width:none}
  .rstage{padding:0 0 8px}
  .loc-wrap{padding:10px 10px 70px}
}
@media (min-width:641px){
  .lb{display:inline}
  .modal{align-items:center}
  .modal-card{border-radius:16px;margin:20px}
}
</style>
</head>
<body>
<div class="app" id="app">

  <header class="top">
    <div class="brand">
      <div class="logo">PMC</div>
      <div>
        <h1>Principles of Modern Chemistry</h1>
        <p class="sub">7th Edition · 目录浏览与智能检索</p>
      </div>
    </div>
    <div class="search" id="searchWrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off" placeholder="搜索章节、小节或关键词，如 equilibrium、17.4">
      <kbd>/</kbd>
    </div>
    <button class="btn" id="expandAll">展开全部</button>
    <button class="btn" id="collapseAll">折叠全部</button>
  </header>

  <div class="stage">

    <section class="view" id="viewToc">
      <div class="toc-head">
        <span id="count">共 170 个小节</span>
        <span class="grow"></span>
        <span class="chip" id="aiChip">✨ AI 检索</span>
        <span class="chip accent hidden" id="resumeChip">继续阅读 <b id="resumeText"></b> ▶</span>
      </div>
      <div class="toc" id="toc"></div>
    </section>

    <section class="view" id="viewLocate" hidden>
      <div class="rbar">
        <button class="ibtn txt" id="locBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg><span class="lb">目录</span></button>
        <div class="rt">
          <div class="vt" id="locQuery">—</div>
          <div class="vs" id="locMeta">—</div>
        </div>
        <button class="ibtn" id="locAgain" title="重新提问"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg></button>
      </div>
      <div class="loc-wrap" id="locWrap"></div>
    </section>

    <section class="view" id="viewRead" hidden>
      <div class="rbar">
        <button class="ibtn txt" id="btnBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg><span class="lb">目录</span></button>
        <div class="rt">
          <div class="vt" id="rTitle">—</div>
          <div class="vs" id="rCtx">—</div>
        </div>
        <button class="ibtn" id="btnZoomOut" title="缩小"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/><path d="M8 11h6"/></svg></button>
        <button class="ibtn" id="btnZoomIn" title="放大"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/><path d="M8 11h6"/><path d="M11 8v6"/></svg></button>
        <button class="ibtn ai" id="btnAI" title="AI 检索"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 13.7 8 18 9.7l-4.3 1.7L12 16l-1.7-4.6L6 9.7 10.3 8z"/><path d="M18.5 15.5 19.3 17.7 21.5 18.5l-2.2.8-.8 2.2-.8-2.2L15.5 18.5l2.2-.8z"/></svg></button>
        <button class="ibtn" id="btnExt" title="用 PDF 打开"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg></button>
      </div>
      <div class="rstage" id="rstage">
        <div class="pagewrap" id="pagewrap">
          <div class="pload" id="pload"><span class="spinner"></span></div>
          <div class="pgmiss" id="pgmiss">该页图片缺失，请重新生成或改用 PDF 打开。</div>
          <img id="pageImg" alt="书页">
        </div>
      </div>

  const needle = esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

function render(){
  const q = norm(query).trim();
  let html = '', shown = 0;

  const fr = DATA.front.map((f,i)=>({...f, idx:i})).filter(f => !q || norm(f.title).includes(q));
  if(fr.length){
    html += '<div class="block" data-block="front">' + head('front','前','Front Matter 前置内容', fr.length+' 项', '');
    html += '<div class="block-body">';
    fr.forEach(f => { shown++; html += leafRow(f.idx, '', f.title, f.printed, q); });
    html += '</div></div>';
  }

  let base = DATA.front.length;
  DATA.units.forEach((u, ui) => {
    const rid = 'u'+ui, rn = romanOf(u.title);
    const chs = u.chapters.map((c, ci) => ({c, ci, secs: c.sections.map(s => ({...s, idx: 0}))}));
    let cursor = base;
    chs.forEach(ch => ch.secs.forEach(s => { s.idx = cursor++; }));
    base += u.chapters.reduce((a,c)=>a+c.sections.length,0);

    const vis = chs.map(ch => {
      const secs = ch.secs.filter(s => !q || norm(s.num+' '+s.title).includes(q) || norm(ch.c.title).includes(q) || norm('ch'+ch.c.num).includes(q) || norm('chapter '+ch.c.num).includes(q));
      const ok = !q || norm(ch.c.title).includes(q) || norm('ch'+ch.c.num).includes(q) || norm('chapter '+ch.c.num).includes(q) || secs.length > 0;
      return {ch, secs, ok};
    }).filter(x => x.ok);
    if(q && vis.length === 0 && !norm(u.title).includes(q) && !norm('unit '+rn).includes(q)) return;

    const isOpen = q ? true : expanded.has(rid);
    html += '<div class="block'+(isOpen?'':' collapsed')+'" data-block="'+rid+'">';
    html += head(rid, rn, esc(u.title), vis.length+' 章 · '+(u.printed?'p. '+u.printed:''), (ui%3===1?'alt':(ui%3===2?'warm':'')));
    html += '<div class="block-body">';
    vis.forEach(({ch, secs}) => {
      const cid = rid+'-c'+ch.ci;
      const cOpen = q ? true : chExpanded.has(cid);
      html += '<div class="chapter'+(cOpen?'':' collapsed')+'" data-ch="'+cid+'">';
      html += '<div class="ch-head"><span class="ch-num">Ch '+ch.c.num+'</span><span class="ct">'+hl(ch.c.title,q)+'</span>'
            + '<span class="pg">'+(ch.c.printed?'p. '+ch.c.printed:'')+'</span>'
            + '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></div>';
      html += '<div class="ch-body">';
      if(secs.length) secs.forEach(s => { shown++; html += leafRow(s.idx, s.num, s.title, s.printed, q, s.hw); });
      else html += '<div class="muted">本章暂无匹配小节</div>';
      html += '</div></div>';
    });
    html += '</div></div>';
  });

  if(DATA.appendices){
    const ap = DATA.appendices.items
      .map(a => ({...a, idx: idToIdx.get(a.id)}))
      .filter(a => !q || norm(a.title).includes(q));
    if(ap.length){
      html += '<div class="block'+(q?'':' collapsed')+'" data-block="appendix">';
      html += head('appendix','附','Appendices 附录', ap.length+' 项', 'warm');
      html += '<div class="block-body">';
      ap.forEach(a => { shown++; html += leafRow(a.idx, '', a.title, a.printed, q); });
      html += '</div></div>';
    }
  }
  if(DATA.index){
    const ix = DATA.index;
    if(!q || norm(ix.title).includes(q) || norm('index glossary').includes(q)){
      shown++;
      html += '<div class="block" data-block="index">' + head('index','索','Index / Glossary 索引与术语表','','alt');
      html += '<div class="block-body">' + leafRow(idToIdx.get(ix.id), '', ix.title, ix.printed, q) + '</div></div>';
    }

  $('#count').textContent = q ? ('命中 ' + shown + ' 个条目') : ('共 ' + DATA.counts.sections + ' 个小节 · ' + DATA.counts.chapters + ' 章');
  if(activeIdx >= 0) markActive();
  updateResume();
}

function markActive(){
  document.querySelectorAll('.leaf.active').forEach(e => e.classList.remove('active'));
  const el = document.querySelector('.leaf[data-idx="'+activeIdx+'"]');
  if(el) el.classList.add('active');
}
function updateResume(){
  const c = $('#resumeChip');
  if(activeIdx < 0){ c.classList.add('hidden'); return; }
  const it = LEAVES[activeIdx];
  $('#resumeText').textContent = (it.num ? it.num+' ' : '') + it.title;
  c.classList.remove('hidden');
}

/* ---- views ---- */
function showToc(){
  $('#viewRead').hidden = true; $('#viewLocate').hidden = true; $('#viewToc').hidden = false;
  $('#app').classList.remove('reading');
  if(activeIdx >= 0){ const el = document.querySelector('.leaf[data-idx="'+activeIdx+'"]'); if(el) el.scrollIntoView({block:'center'}); }
}
function showRead(){
  $('#viewToc').hidden = true; $('#viewLocate').hidden = true; $('#viewRead').hidden = false;
  $('#app').classList.add('reading');
  if(!swipeHinted){ swipeHinted = true; setTimeout(() => toast(AI_ENABLED ? '左右滑动翻页 · 双击放大 · 点 ✦ 按钮 AI 检索' : '左右滑动翻页 · 双击放大'), 650); }
}
function showLocate(){
  $('#viewToc').hidden = true; $('#viewRead').hidden = true; $('#viewLocate').hidden = false;
  $('#app').classList.add('reading');
}

/* ---- reader ---- */
function leafForPage(p){
  let best = -1, bp = -1;
  LEAVES.forEach((L,i) => { if(L.pdf <= p && L.pdf >= bp){ bp = L.pdf; best = i; } });
  return best;
}
function setZoom(z, keepScroll){
  zoom = Math.max(ZOOMS[0], Math.min(ZOOMS[ZOOMS.length-1], z));
  const w = $('#pagewrap');
  if(zoom <= 1.001){ w.style.width = ''; w.style.maxWidth = ''; }
  else { w.style.maxWidth = 'none'; w.style.width = (zoom*100) + '%'; }
  if(!keepScroll) $('#rstage').scrollTop = 0;
}
function preload(p){ if(p>=1 && p<=TOTAL){ const im = new Image(); im.src = pageSrc(p); } }

function setPage(p, opts){
  p = Math.max(1, Math.min(TOTAL, p));
  const first = (curPage !== p) || !$('#pageImg').getAttribute('src');
  curPage = p;
  $('#pgNow').textContent = p + ' / ' + TOTAL;
  if(!(opts && opts.keepLeaf)){
    const li = leafForPage(p);
    if(li >= 0){
      activeIdx = li;
      const it = LEAVES[li];
      $('#rTitle').textContent = (it.num ? it.num + ' ' : '') + it.title;
      $('#rCtx').textContent = it.ctx + ' · 原书 p.' + (it.printed !== '' ? it.printed : it.pdf) + ' · PDF 第 ' + p + ' 页';
    }
  }
  markActive();
  $('#btnPrevPage').disabled = p <= 1;
  $('#btnNextPage').disabled = p >= TOTAL;
  $('#btnPrevSec').disabled = activeIdx <= 0;
  $('#btnNextSec').disabled = activeIdx >= LEAVES.length - 1;
  $('#pgmiss').classList.remove('show');
  if(first){
    $('#pload').classList.add('show');
    $('#pageImg').src = pageSrc(p);
  }
  preload(p+1); preload(p-1);
  try{ localStorage.setItem('pmc_state', JSON.stringify({page: p, idx: activeIdx})); }catch(_){}
}
$('#pageImg').addEventListener('load', () => {
  $('#pload').classList.remove('show'); $('#pgmiss').classList.remove('show');
  const im = $('#pageImg'); im.classList.remove('anim'); void im.offsetWidth; im.classList.add('anim');
});
$('#pageImg').addEventListener('error', () => { $('#pload').classList.remove('show'); $('#pgmiss').classList.add('show'); });

function openLeaf(i){
  if(i < 0 || i >= LEAVES.length) return;
  activeIdx = i;
  showRead(); setZoom(1); setPage(LEAVES[i].pdf);
}
function openHw(i, pdf, printed){
  if(i < 0 || i >= LEAVES.length) return;
  activeIdx = i;
  showRead(); setZoom(1); setPage(pdf, {keepLeaf: true});
  const it = LEAVES[i];
  $('#rTitle').textContent = '作业 · ' + (it.num ? it.num + ' ' : '') + it.title;
  $('#rCtx').textContent = '本节习题 · 原书 p.' + printed + ' · PDF 第 ' + pdf + ' 页';
}

/* ---- toast ---- */
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ---- AI 检索弹窗 ---- */
function openAsk(){
  if(!AI_ENABLED){ toast('本页为纯静态阅读版，AI 检索请使用服务器版'); return; }
  $('#askInput').value = ''; setAskStatus('');
  $('#askModal').hidden = false;
  setTimeout(() => $('#askInput').focus(), 80);
}
function closeAsk(){ $('#askModal').hidden = true; }
function setAskStatus(msg, kind){
  const el = $('#askStatus'); el.textContent = msg || '';
  el.className = 'ask-status' + (kind ? ' ' + kind : '');
}
async function submitAsk(){
  const q = $('#askInput').value.trim();
  if(!q){ setAskStatus('请输入要检索的知识点或问题', 'error'); return; }
  if(location.protocol === 'file:'){
    setAskStatus('本地打开时无法调用 AI 检索，请使用服务器版 http://47.97.226.186/chem/', 'error');
    return;
  }
  $('#askGo').disabled = true;
  setAskStatus('GLM-4.5-Air 正在检索目录…', 'loading');
  try{
    const resp = await fetch('api/locate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({query: q})
    });
    const data = await resp.json().catch(() => ({}));
    if(!resp.ok) throw new Error(data.error || ('HTTP ' + resp.status));
    lastLocate = {q, data};
    renderLocate(q, data);
    closeAsk();
    showLocate();
  }catch(e){
    setAskStatus('检索失败：' + e.message, 'error');
  }finally{
    $('#askGo').disabled = false;
  }
}
// 把 GLM 返回的编号解析成 LEAVES 下标。模型偶尔会返回 "CH 5.5" 这类拼接写法，
// 这里做容错归一：章节号落到该章第一小节，单元落到该单元第一小节。
function resolveNum(raw){
  let s = String(raw || '').trim().toUpperCase().replace(/\s+/g, ' ');
  if(!s) return -1;
  if(idToIdx.has(s)) return idToIdx.get(s);
  let m;
  if((m = s.match(/^(?:CH|CHAPTER)\s*0*(\d+)(?:\.(\d+))?$/))){
    const n = +m[1];
    if(m[2]){ const k = n + '.' + (+m[2]); if(idToIdx.has(k)) return idToIdx.get(k); }
    if(chapterFirst.has(n)) return idToIdx.get(chapterFirst.get(n));
    return -1;
  }
  if((m = s.match(/^UNIT\s+([IVX]+)$/))) return unitFirst.has(m[1]) ? idToIdx.get(unitFirst.get(m[1])) : -1;
  if((m = s.match(/^(?:APX|APPENDIX)[\s-]*([A-Z])$/))){ const k = 'APX-' + m[1]; return idToIdx.has(k) ? idToIdx.get(k) : -1; }
  if((m = s.match(/^(\d+)\.(\d+)$/))){ const k = (+m[1]) + '.' + (+m[2]); return idToIdx.has(k) ? idToIdx.get(k) : -1; }
  if((m = s.match(/(\d+)\.(\d+)/))){ const k = (+m[1]) + '.' + (+m[2]); if(idToIdx.has(k)) return idToIdx.get(k); }
  return -1;
}

function renderLocate(q, data){
  const seen = new Set(), uniq = [];
  (data.items || []).forEach(it => {
    const key = String(it.num || '').trim();
    const idx = resolveNum(key);
    if(idx < 0 || seen.has(idx)) return;
    seen.add(idx);
    uniq.push({idx, reason: String(it.reason || '').trim()});
  });
  $('#locQuery').textContent = q;
  $('#locMeta').textContent = uniq.length ? ('AI 定位到 ' + uniq.length + ' 个相关小节') : '未定位到相关小节';
  let html = '';
  if(data.note) html += '<div class="loc-note">' + esc(data.note) + '</div>';
  if(!uniq.length){
    html += '<div class="loc-empty">没有从目录中定位到相关小节。<br>可以换个说法再问一次，或返回目录手动查找。</div>';
  } else {
    uniq.forEach((x, i) => {
      const L = LEAVES[x.idx];
      html += '<div class="loc-item" data-idx="' + x.idx + '">'
        + '<div class="loc-rank">' + (i + 1) + '</div>'
        + '<div class="loc-main">'
        + '<div class="loc-title">' + (L.num ? '<span class="snum">' + esc(L.num) + '</span>' : '') + esc(L.title) + '</div>'
        + '<div class="loc-ctx">' + esc(L.ctx) + ' · 原书 p.' + esc(L.printed !== '' ? L.printed : L.pdf) + ' · PDF 第 ' + L.pdf + ' 页</div>'
        + (x.reason ? '<div class="loc-reason">' + esc(x.reason) + '</div>' : '')
        + '</div>'
        + '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>'
        + '</div>';
    });
  }
  $('#locWrap').innerHTML = html;
}

/* ---- toc events ---- */
$('#toc').addEventListener('click', e => {
  const hw = e.target.closest('.hwrow');
  if(hw){ openHw(+hw.dataset.idx, +hw.dataset.hw, hw.dataset.hwp); return; }
  const leaf = e.target.closest('.leaf');
  if(leaf){
    const i = +leaf.dataset.idx;
    if(e.ctrlKey || e.metaKey){ window.open(PDF_URL + '#page=' + LEAVES[i].pdf, '_blank'); return; }
    openLeaf(i); return;
  }
  const bh = e.target.closest('.block-head');
  if(bh){
    const block = bh.closest('.block'), id = block.dataset.block;
    if(query){ query=''; $('#q').value=''; render(); return; }
    block.classList.toggle('collapsed');
    if(block.classList.contains('collapsed')) expanded.delete(id); else expanded.add(id);
    return;
  }
  const chh = e.target.closest('.ch-head');
  if(chh){
    const ch = chh.closest('.chapter'); ch.classList.toggle('collapsed');
    const id = ch.dataset.ch;
    if(ch.classList.contains('collapsed')) chExpanded.delete(id); else chExpanded.add(id);
  }
});
$('#q').addEventListener('input', e => { query = e.target.value; render(); });
$('#expandAll').addEventListener('click', () => {
  query=''; $('#q').value='';
  DATA.units.forEach((u,ui)=>{ expanded.add('u'+ui); u.chapters.forEach((c,ci)=>chExpanded.add('u'+ui+'-c'+ci)); });
  render();
});
$('#collapseAll').addEventListener('click', () => { query=''; $('#q').value=''; expanded.clear(); chExpanded.clear(); render(); });
$('#resumeChip').addEventListener('click', () => openLeaf(activeIdx));
$('#aiChip').addEventListener('click', openAsk);

/* ---- locate events ---- */
$('#locBack').addEventListener('click', showToc);
$('#locAgain').addEventListener('click', openAsk);
$('#locWrap').addEventListener('click', e => {
  const it = e.target.closest('.loc-item');
  if(it) openLeaf(+it.dataset.idx);
});

/* ---- modal events ---- */
$('#askClose').addEventListener('click', closeAsk);
$('#askCancel').addEventListener('click', closeAsk);
$('#askGo').addEventListener('click', submitAsk);
$('#askModal').addEventListener('click', e => { if(e.target === $('#askModal')) closeAsk(); });
$('#askHints').addEventListener('click', e => {
  const c = e.target.closest('.hint-chip');
  if(c){ $('#askInput').value = c.textContent.trim(); $('#askInput').focus(); }
});
$('#askInput').addEventListener('keydown', e => {
  if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); submitAsk(); }
});

/* ---- reader events ---- */
$('#btnBack').addEventListener('click', showToc);
$('#btnPrevPage').addEventListener('click', () => setPage(curPage - 1));
$('#btnNextPage').addEventListener('click', () => setPage(curPage + 1));
$('#btnPrevSec').addEventListener('click', () => openLeaf(activeIdx - 1));
$('#btnNextSec').addEventListener('click', () => openLeaf(activeIdx + 1));
$('#btnZoomIn').addEventListener('click', () => {
  const i = ZOOMS.findIndex(z => z > zoom + 0.01);
  if(i < 0){ toast('已放到最大'); return; }
  setZoom(ZOOMS[i], true);
});
$('#btnZoomOut').addEventListener('click', () => {
  let i = -1;
  for(let k = ZOOMS.length - 1; k >= 0; k--){ if(ZOOMS[k] < zoom - 0.01){ i = k; break; } }
  if(i < 0){ toast('已缩到最小'); return; }
  setZoom(ZOOMS[i], true);
});
$('#btnExt').addEventListener('click', () => window.open(PDF_URL + '#page=' + curPage, '_blank'));
$('#btnAI').addEventListener('click', openAsk);

/* ---- 滑动翻页（触摸 + 鼠标拖拽） ---- */
(function(){
  const st = $('#rstage');
  let x0 = 0, y0 = 0, moved = false, lastTap = 0, dragging = false;
  function down(x, y){ x0 = x; y0 = y; moved = false; }
  function move(x, y){ if(Math.abs(x - x0) > 12) moved = true; }
  function up(x, y){
    const dx = x - x0, dy = y - y0, now = Date.now();
    if(!moved && Math.abs(dx) < 12 && Math.abs(dy) < 12){
      if(now - lastTap < 300){ setZoom(zoom > 1.01 ? 1 : 2, true); lastTap = 0; return; }
      lastTap = now; return;
    }
    if(zoom <= 1.01 && Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.2){
      if(dx < 0) setPage(curPage + 1); else setPage(curPage - 1);
    }
  }
  st.addEventListener('touchstart', e => { if(e.touches.length === 1) down(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});
  st.addEventListener('touchmove', e => { if(e.touches.length === 1) move(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});
  st.addEventListener('touchend', e => { const t = e.changedTouches[0]; up(t.clientX, t.clientY); }, {passive:true});
  st.addEventListener('mousedown', e => { if(e.button === 0){ dragging = true; down(e.clientX, e.clientY); } });
  st.addEventListener('mousemove', e => { if(dragging) move(e.clientX, e.clientY); });
  st.addEventListener('mouseup', e => { if(dragging){ dragging = false; up(e.clientX, e.clientY); } });
  st.addEventListener('mouseleave', () => { dragging = false; });
})();





document.addEventListener('keydown', e => {
  const askOpen = !$('#askModal').hidden;
  if(askOpen){ if(e.key === 'Escape') closeAsk(); return; }
  const reading = !$('#viewRead').hidden, locating = !$('#viewLocate').hidden;
  if(e.key === '/' && !reading && !locating && document.activeElement !== $('#q')){ e.preventDefault(); $('#q').focus(); return; }
  if(e.key === 'Escape'){
    if(document.activeElement === $('#q')){ $('#q').value=''; query=''; render(); $('#q').blur(); }
    else if(reading || locating){ showToc(); }
    return;
  }
  if(reading){
    if(e.key === 'ArrowLeft'){ e.preventDefault(); setPage(curPage - 1); }
    if(e.key === 'ArrowRight'){ e.preventDefault(); setPage(curPage + 1); }
    if(e.altKey && e.key === 'ArrowLeft'){ e.preventDefault(); openLeaf(activeIdx - 1); }
    if(e.altKey && e.key === 'ArrowRight'){ e.preventDefault(); openLeaf(activeIdx + 1); }
  }
  if(e.key === 'a' || e.key === 'A'){ if(!reading && !locating) openAsk(); }
});

/* ---- init ---- */
$('#btnPrevPage').disabled = true; $('#btnPrevSec').disabled = true; $('#btnNextSec').disabled = true;
if(!AI_ENABLED){ $('#btnAI').hidden = true; $('#aiChip').hidden = true; $('#btnExt').hidden = true; }
try{
  const s = JSON.parse(localStorage.getItem('pmc_state') || 'null');
  if(s && s.idx >= 0 && s.idx < LEAVES.length){ activeIdx = s.idx; curPage = s.page || LEAVES[s.idx].pdf; }
}catch(_){}
render();
</script>
